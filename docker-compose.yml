services:
  mcp-vault:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./vault:/vault
      - ./data:/data
    environment:
      # Creates the first user on first start; remove afterwards if you like.
      MCP_VAULT_ADMIN_USER: me
      MCP_VAULT_ADMIN_PASSWORD: change-me-please
      # Set when running behind a reverse proxy (Caddy, nginx, Tailscale serve, …).
      MCP_VAULT_TRUST_PROXY: "false"
